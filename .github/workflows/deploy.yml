# Sestaví aplikaci a nasadí ji na GitHub Pages. Nepotřebuje žádné secrets, používá vestavěný token.
# Jednorázově: Settings → Pages → Source: GitHub Actions.
# Balíčky ze SRD (content-packs/srd) se kopírují do dist/packs; ostatní texty (content-packs/local) v repozitáři nejsou.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: |
          mkdir -p dist/packs
          cp content-packs/srd/*.json dist/packs/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
